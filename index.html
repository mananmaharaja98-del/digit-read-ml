
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digit Reader</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 30px auto;
      padding: 20px;
      text-align: center;
      background: #f5f7fa;
      color: #202124;
    }
    .panel {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 2px 12px #00000012;
    }
    button, input {
      margin: 12px 0;
      font-size: 16px;
    }
    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #1769e0;
      color: white;
      cursor: pointer;
    }
    img {
      display: block;
      max-width: 100%;
      max-height: 280px;
      margin: 16px auto;
      border-radius: 8px;
    }
    #result {
      font-size: 24px;
      font-weight: bold;
      margin: 18px 0;
    }
    #status {
      font-size: 14px;
      overflow-wrap: anywhere;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@3.20.0/dist/tf-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-cpu@3.20.0/dist/tf-backend-cpu.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.9/dist/tf-tflite.min.js"></script>
</head>

<body>
  <div class="panel">
    <h1>Digit Reader</h1>
    <p>Take a photo or select an image containing one handwritten digit.</p>

    <input
      id="photo"
      type="file"
      accept="image/*"
      capture="environment"
    >

    <img id="preview" alt="Selected digit" hidden>

    <button id="readButton" disabled>Recognise digit</button>

    <div id="result">Digit: —</div>
    <p id="status">Loading machine-learning model…</p>
  </div>

  <script>
    const MODEL_URL =
      "https://raw.githubusercontent.com/mananmaharaja98-del/digit-read-ml/main/mnist_model.tflite";

    let model = null;

    const photo = document.getElementById("photo");
    const preview = document.getElementById("preview");
    const readButton = document.getElementById("readButton");
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    async function initialise() {
      try {
        status.textContent = "Initialising TensorFlow…";

        await tf.setBackend("cpu");
        await tf.ready();

        status.textContent = "Loading digit model…";

        tflite.setWasmPath(
          "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.9/dist/"
        );

        model = await tflite.loadTFLiteModel(MODEL_URL);

        status.textContent = "Model loaded. Select a digit photo.";
        readButton.disabled = !preview.src;
      } catch (error) {
        console.error("Model initialisation failed:", error);
        status.textContent =
          "Model failed to load: " + (error.message || String(error));
      }
    }

    photo.addEventListener("change", () => {
      const file = photo.files && photo.files[0];
      if (!file) return;

      preview.src = URL.createObjectURL(file);
      preview.hidden = false;

      preview.onload = () => {
        readButton.disabled = !model;
        status.textContent = model
          ? "Photo ready. Tap Recognise digit."
          : "Photo ready; waiting for model.";
      };
    });

    readButton.addEventListener("click", async () => {
      if (!model || !preview.complete || !preview.naturalWidth) return;

      let inputTensor;
      let outputTensor;

      try {
        readButton.disabled = true;
        status.textContent = "Recognising…";

        const canvas = document.createElement("canvas");
        canvas.width = 28;
        canvas.height = 28;

        const ctx = canvas.getContext("2d", {
          willReadFrequently: true
        });

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 28, 28);

        // Fit the image into a square while preserving its proportions.
        const scale = Math.min(
          20 / preview.naturalWidth,
          20 / preview.naturalHeight
        );

        const width = preview.naturalWidth * scale;
        const height = preview.naturalHeight * scale;

        ctx.drawImage(
          preview,
          (28 - width) / 2,
          (28 - height) / 2,
          width,
          height
        );

        const pixels = ctx.getImageData(0, 0, 28, 28).data;
        const values = new Float32Array(28 * 28);

        for (let i = 0; i < 28 * 28; i++) {
          const offset = i * 4;
          const gray =
            0.299 * pixels[offset] +
            0.587 * pixels[offset + 1] +
            0.114 * pixels[offset + 2];

          // MNIST commonly uses white strokes on a black background.
          values[i] = (255 - gray) / 255;
        }

        inputTensor = tf.tensor4d(values, [1, 28, 28, 1]);

        outputTensor = model.predict(inputTensor);

        const scores = await outputTensor.data();

        if (scores.length < 10) {
          throw new Error(
            "Expected 10 digit scores, but received " + scores.length
          );
        }

        let bestDigit = 0;
        for (let i = 1; i < 10; i++) {
          if (scores[i] > scores[bestDigit]) bestDigit = i;
        }

        result.textContent = "Digit: " + bestDigit;
        status.textContent = "Recognition complete.";
      } catch (error) {
        console.error("Prediction failed:", error);
        status.textContent =
          "Recognition failed: " + (error.message || String(error));
      } finally {
        if (inputTensor) inputTensor.dispose();
        if (outputTensor && typeof outputTensor.dispose === "function") {
          outputTensor.dispose();
        }
        readButton.disabled = !model;
      }
    });

    initialise();
  </script>
</body>
</html>
